<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090d12">
    <title>🎰 Roleta de Cassino - Tela Principal (Notebook)</title>
    
    <!-- CDNs: PeerJS, TailwindCSS e FontAwesome -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #070a0e;
            color: #fff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Moldura de Luzes de Cassino */
        .cassino-frame {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 5px solid #f59e0b;
            border-radius: 28px;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.35), inset 0 0 15px rgba(0, 0, 0, 0.8);
            position: relative;
            padding: 28px 20px;
            width: 100%;
            max-width: 820px;
        }

        .luz-cassino {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f1c40f;
            box-shadow: 0 0 10px #f1c40f, 0 0 20px #f1c40f;
            animation: piscarLuz 1.2s infinite alternate ease-in-out;
        }

        .luz-cassino:nth-child(even) {
            animation-delay: 0.6s;
            background: #e74c3c;
            box-shadow: 0 0 10px #e74c3c, 0 0 20px #e74c3c;
        }

        @keyframes piscarLuz {
            0% { opacity: 0.3; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1.15); }
        }

        /* Display dos Reels (Carretéis) */
        .slot-display {
            background: #05080c;
            border: 4px solid #334155;
            border-radius: 20px;
            padding: 20px 12px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.9);
            margin-bottom: 24px;
        }

        .reel-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .reel {
            width: 100%;
            height: 100px;
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 50%, #e2e8f0 100%);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            box-shadow: inset 0 8px 12px rgba(0,0,0,0.3), inset 0 -8px 12px rgba(0,0,0,0.3), 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s ease;
            position: relative;
            overflow: hidden;
        }

        .reel.girando {
            animation: balancoGiro 0.08s infinite linear;
            filter: blur(1px);
        }

        @keyframes balancoGiro {
            0% { transform: translateY(-3px); }
            50% { transform: translateY(3px); }
            100% { transform: translateY(-3px); }
        }

        /* Botões de Ação */
        .btn-girar {
            background: linear-gradient(180deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            width: 100%;
            padding: 10px 0;
            font-size: 0.9rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #1e40af, 0 6px 12px rgba(0,0,0,0.4);
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-girar:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1e40af;
        }

        .btn-girar:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .btn-acao-principal {
            background: linear-gradient(180deg, #10b981, #047857);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 900;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 5px 0 #065f46, 0 8px 20px rgba(16, 185, 129, 0.3);
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-acao-principal:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #065f46;
        }

        .btn-resetar {
            background: linear-gradient(180deg, #ef4444, #b91c1c);
            box-shadow: 0 5px 0 #991b1b, 0 8px 20px rgba(239, 68, 68, 0.3);
        }

        .btn-resetar:active {
            box-shadow: 0 2px 0 #991b1b;
        }
    </style>
</head>
<body>

    <!-- MOLDURA DE LUZES SUPERIOR -->
    <div class="w-full max-w-[820px] flex justify-between items-center px-4 mb-2">
        <div class="luz-cassino"></div>
        <div class="luz-cassino"></div>
        <div class="luz-cassino"></div>
        <div class="luz-cassino"></div>
        <div class="luz-cassino"></div>
        <div class="luz-cassino"></div>
        <div class="luz-cassino"></div>
        <div class="luz-cassino"></div>
        <div class="luz-cassino"></div>
        <div class="luz-cassino"></div>
    </div>

    <!-- CARTÃO PRINCIPAL DA ROLETA -->
    <main class="cassino-frame">
        
        <!-- CABEÇALHO DO CASSINO -->
        <header class="flex flex-col sm:flex-row items-center justify-between border-b border-slate-700/80 pb-4 mb-5 gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center text-slate-950 font-black text-2xl shadow-lg border border-amber-200">
                    🎰
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-wider text-amber-400 uppercase leading-none">
                        Roletas Livres
                    </h1>
                    <p class="text-xs text-slate-400 font-medium mt-1">
                        Sistema Remoto P2P com Celular
                    </p>
                </div>
            </div>

            <!-- BADGE DO MODO DE JOGO ATUAL (OCULTO) -->
            <div class="hidden bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl items-center gap-3">
                <span class="text-[11px] text-slate-400 font-extrabold uppercase tracking-wider">Modo Atual:</span>
                <span id="badgeModo" class="text-sm font-black text-blue-400 uppercase tracking-widest bg-blue-950/60 px-3 py-1 rounded-lg border border-blue-800/50">
                    NORMAL
                </span>
            </div>
        </header>

        <!-- ROLETA / CARRETÉIS DE CASSINO (5 REELS) -->
        <section class="slot-display">
            <!-- REEL 1 -->
            <div class="reel-box">
                <div class="reel" id="r1">🍒</div>
                <button class="btn-girar" id="btnGirar1" onclick="girarReelIndependente(1)">GIRAR</button>
            </div>
            <!-- REEL 2 -->
            <div class="reel-box">
                <div class="reel" id="r2">🍋</div>
                <button class="btn-girar" id="btnGirar2" onclick="girarReelIndependente(2)">GIRAR</button>
            </div>
            <!-- REEL 3 -->
            <div class="reel-box">
                <div class="reel" id="r3">🔔</div>
                <button class="btn-girar" id="btnGirar3" onclick="girarReelIndependente(3)">GIRAR</button>
            </div>
            <!-- REEL 4 -->
            <div class="reel-box">
                <div class="reel" id="r4">⭐</div>
                <button class="btn-girar" id="btnGirar4" onclick="girarReelIndependente(4)">GIRAR</button>
            </div>
            <!-- REEL 5 -->
            <div class="reel-box">
                <div class="reel" id="r5">💎</div>
                <button class="btn-girar" id="btnGirar5" onclick="girarReelIndependente(5)">GIRAR</button>
            </div>
        </section>

        <!-- PAINEL DE AÇÕES DA TELA -->
        <footer class="flex flex-wrap items-center justify-between gap-4 pt-2">
            <button class="btn-acao-principal flex-1" id="btnGirarTodos" onclick="girarTodosOsReels()">
                <i class="fa-solid fa-play mr-2"></i> GIRAR TODOS
            </button>
            <button class="btn-acao-principal btn-resetar" onclick="resetarRoletas()">
                <i class="fa-solid fa-rotate-right mr-2"></i> RESETAR
            </button>
        </footer>

    </main>

    <!-- MOLDURA DE LUZES INFERIOR -->
    <div class="w-full max-w-[820px] flex justify-between items-center px-4 mt-2">
        <div class="luz-cassino"></div>
        <div class="luz-cassino"></div>
        <div class="luz-cassino"></div>
        <div class="luz-cassino"></div>
        <div class="luz-cassino"></div>
        <div class="luz-cassino"></div>
        <div class="luz-cassino"></div>
        <div class="luz-cassino"></div>
        <div class="luz-cassino"></div>
        <div class="luz-cassino"></div>
    </div>

    <script>
        // --- ESTADO GLOBAL DA APLICAÇÃO ---
        const simbolos = ["🍒", "🍋", "🍉", "🔔", "⭐", "💎", "7️⃣"];
        let modoAtual = "normal"; // 'normal', 'facil', ou 'dificil'
        let simboloAlvoFacil = null;

        const roomCode = '7646'; // Código P2P fixo
        let peerNotebook = null;

        // Canal local para testes na mesma aba/navegador
        let broadcastChannel = null;
        try {
            broadcastChannel = new BroadcastChannel('roleta_p2p_channel');
        } catch (e) {
            console.warn("BroadcastChannel não suportado neste navegador:", e);
        }

        // --- SISTEMA DE EFEITOS SONOROS SINTETIZADOS (WEB AUDIO API) ---
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function tocarSomClique() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.05);
            } catch (e) {}
        }

        function tocarSomGiro() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.04);
            } catch (e) {}
        }

        function tocarSomVitoria() {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const notas = [523.25, 659.25, 783.99, 1046.50]; // Do, Mi, Sol, Do (Agudo)
                notas.forEach((nota, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(nota, ctx.currentTime + (index * 0.12));
                    gain.gain.setValueAtTime(0.2, ctx.currentTime + (index * 0.12));
                    gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + (index * 0.12) + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + (index * 0.12));
                    osc.stop(ctx.currentTime + (index * 0.12) + 0.25);
                });
            } catch (e) {}
        }

        window.addEventListener('load', () => {
            initPeerNotebook();
        });

        // INICIALIZAÇÃO DO SERVIDOR RECEPTOR (NOTEBOOK)
        function initPeerNotebook() {
            const peerId = 'roleta-' + roomCode;

            // Escuta mensagens via BroadcastChannel local (Fallback offline/local)
            if (broadcastChannel) {
                broadcastChannel.onmessage = (event) => {
                    const data = event.data;
                    if (data && data.targetCode === roomCode && data.payload) {
                        processarComandoRemoto(data.payload);
                    }
                };
            }

            // Tenta conectar à nuvem PeerJS
            try {
                peerNotebook = new Peer(peerId);

                peerNotebook.on('connection', (conn) => {
                    tocarSomVitoria();

                    conn.on('data', (data) => {
                        processarComandoRemoto(data);
                    });
                });

                peerNotebook.on('error', (err) => {
                    console.warn("PeerJS operando em modo fallback local:", err);
                });
            } catch (e) {
                console.warn("WebSocket bloqueado ou sem acesso externo:", e);
            }
        }

        function processarComandoRemoto(comando) {
            tocarSomClique();
            
            if (comando.action === 'modo') {
                alterarModoJogo(comando.val);
            } else if (comando.action === 'girar') {
                girarReelIndependente(comando.val || 1);
            } else if (comando.action === 'girar_todos') {
                girarTodosOsReels();
            } else if (comando.action === 'reset') {
                resetarRoletas();
            }
        }

        function alterarModoJogo(novoModo) {
            modoAtual = novoModo;
            if (novoModo === 'facil') simboloAlvoFacil = null;

            const badge = document.getElementById('badgeModo');
            if (badge) {
                badge.innerText = novoModo.toUpperCase();

                if (novoModo === 'facil') {
                    badge.className = 'text-sm font-black text-emerald-400 uppercase tracking-widest bg-emerald-950/80 px-3 py-1 rounded-lg border border-emerald-700/60 shadow-lg shadow-emerald-900/30';
                } else if (novoModo === 'dificil') {
                    badge.className = 'text-sm font-black text-rose-400 uppercase tracking-widest bg-rose-950/80 px-3 py-1 rounded-lg border border-rose-700/60 shadow-lg shadow-rose-900/30';
                } else {
                    badge.className = 'text-sm font-black text-blue-400 uppercase tracking-widest bg-blue-950/60 px-3 py-1 rounded-lg border border-blue-800/50';
                }
            }
        }

        function girarReelIndependente(id) {
            const btn = document.getElementById(`btnGirar${id}`);
            const reel = document.getElementById(`r${id}`);

            if (!btn || btn.disabled) return;

            btn.disabled = true;
            reel.classList.add('girando');

            let girosCount = 0;
            const maxGiros = 14;

            const timer = setInterval(() => {
                reel.innerText = simbolos[Math.floor(Math.random() * simbolos.length)];
                tocarSomGiro();
                girosCount++;

                if (girosCount >= maxGiros) {
                    clearInterval(timer);
                    reel.classList.remove('girando');
                    aplicarRegraDeResultado(id);
                    verificarCombinacaoVencedora();
                }
            }, 65);
        }

        function girarTodosOsReels() {
            tocarSomClique();
            for (let i = 1; i <= 5; i++) {
                setTimeout(() => {
                    girarReelIndependente(i);
                }, (i - 1) * 120);
            }
        }

        function aplicarRegraDeResultado(idGirado) {
            const reel = document.getElementById(`r${idGirado}`);

            if (modoAtual === "facil") {
                // Modo Fácil: Força todos os carretéis a cair no mesmo símbolo
                if (!simboloAlvoFacil) {
                    simboloAlvoFacil = simbolos[Math.floor(Math.random() * simbolos.length)];
                }
                reel.innerText = simboloAlvoFacil;

            } else if (modoAtual === "dificil") {
                // Modo Difícil: Impede combinações vitoriosas
                const outrosSimbolos = [];
                for (let i = 1; i <= 5; i++) {
                    if (i !== idGirado) {
                        outrosSimbolos.push(document.getElementById(`r${i}`).innerText);
                    }
                }

                // Sorteia de forma a garantir símbolos divergentes
                const disponiveis = simbolos.filter(s => !outrosSimbolos.includes(s));
                if (disponiveis.length > 0) {
                    reel.innerText = disponiveis[Math.floor(Math.random() * disponiveis.length)];
                } else {
                    reel.innerText = simbolos[Math.floor(Math.random() * simbolos.length)];
                }

            } else {
                // Modo Normal: Sorteio 100% aleatório
                reel.innerText = simbolos[Math.floor(Math.random() * simbolos.length)];
            }
        }

        function verificarCombinacaoVencedora() {
            // Verifica se todos os 5 carretéis terminaram e se são iguais
            const reelsValues = [];
            for (let i = 1; i <= 5; i++) {
                reelsValues.push(document.getElementById(`r${i}`).innerText);
            }

            const todosIguais = reelsValues.every(val => val === reelsValues[0]);

            if (todosIguais) {
                tocarSomVitoria();
                if (window.confetti) {
                    confetti({
                        particleCount: 120,
                        spread: 80,
                        origin: { y: 0.6 }
                    });
                }
            }
        }

        function resetarRoletas() {
            tocarSomClique();
            for (let i = 1; i <= 5; i++) {
                const btn = document.getElementById(`btnGirar${i}`);
                if (btn) btn.disabled = false;
            }
            simboloAlvoFacil = null;
        }
    </script>
</body>
</html>
